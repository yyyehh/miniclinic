<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        h1 { color: #0F2443; margin: 0; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .logout-form { margin: 0; }
        .logout-form button { background: #94A3B8; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .status-BOOKED    { color: #F59E0B; font-weight: bold; }
        .status-COMPLETED { color: #10B981; font-weight: bold; }
        .status-CANCELLED { color: #94A3B8; }
        .complete-btn {
            background: #10B981;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .complete-btn:hover {
            background: #059669;
        }
        .cancel-btn {
            background: #EF4444;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .cancel-btn:hover {
            background: #DC2626;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>歡迎，<span th:text="${doctor.name}"></span>（<span th:text="${doctor.department}"></span>）</p>
        </div>
        <div class="header-actions">
            <a th:href="@{/password}" style="background: #14B8A6; color: white; padding: 6px 14px; text-decoration: none; border-radius: 4px; font-size: 13.3px;">修改密碼</a>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <button type="submit">登出</button>
            </form>
        </div>
    </header>

    <h2 th:text="|今日掛號：${today}|"></h2>

    <p th:if="${appointments.isEmpty()}">今日沒有掛號。</p>

    <table th:unless="${appointments.isEmpty()}">
        <thead>
            <tr>
                <th>時段</th>
                <th>病患</th>
                <th>病歷號</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.timeSlot}">AM</td>
                <td th:text="${appt.patient.name}">測試病患甲</td>
                <td th:text="${appt.patient.chartNo}">TEST00001</td>
                <td>
                    <span th:text="${appt.status}"
                          th:class="${'status-' + appt.status}">BOOKED</span>
                    
                    <!-- 僅在狀態為 BOOKED 時顯示的操作按鈕 -->
                    <th:block th:if="${appt.status == 'BOOKED'}">
                        <button th:data-id="${appt.apptId}"
                                onclick="completeAppointment(this)"
                                class="complete-btn"
                                style="margin-left: 10px;">看診完成</button>
                                
                        <button th:data-id="${appt.apptId}"
                                onclick="cancelAppointment(this)"
                                class="cancel-btn">取消</button>
                    </th:block>
                </td>
            </tr>
        </tbody>
    </table>
        <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}">← 回首頁</a>
    </p>

    <script>
        function completeAppointment(button) {
            const apptId = button.getAttribute('data-id');
            if (!confirm("確定要將此掛號標記為「看診完成」嗎？")) {
                return;
            }

            fetch('/api/appointments/' + apptId + '/status', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'COMPLETED' })
            })
            .then(response => {
                if (response.ok) {
                    alert("看診已標記完成！");
                    window.location.reload(); // 成功後重新整理頁面
                } else {
                    alert("更新失敗，請稍後再試。");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("發生連線錯誤。");
            });
        }

        function cancelAppointment(button) {
            const apptId = button.getAttribute('data-id');
            if (!confirm("確定要取消這筆掛號嗎？")) {
                return; // 使用者按取消，則不執行後續動作
            }

            fetch('/api/appointments/' + apptId + '/status', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'CANCELLED' })
            })
            .then(response => {
                if (response.ok) {
                    alert("掛號已成功取消！");
                    window.location.reload(); // 成功後重新整理頁面
                } else if (response.status === 403) {
                    alert("沒有權限取消這筆掛號。");
                } else {
                    alert("取消失敗，請稍後再試。");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("發生連線錯誤，請檢查網路狀態。");
            });
        }
    </script>
</body>
</html>
