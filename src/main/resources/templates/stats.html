<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        .stat-card { background: #F8FAFC; padding: 20px; border-radius: 8px; border-left: 5px solid #14B8A6; margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
    </style>
</head>
<body>
    <h1>掛號統計資訊</h1>

    <div class="stat-grid">
        <div class="stat-card">
            <h3>醫師總數</h3>
            <p><strong th:text="${doctorCount}">0</strong> 位</p>
        </div>
        <div class="stat-card">
            <h3>病患總數</h3>
            <p><strong th:text="${patientCount}">0</strong> 位</p>
        </div>
        <div class="stat-card">
            <h3>掛號總數</h3>
            <p><strong th:text="${appointmentCount}">0</strong> 筆</p>
        </div>
    </div>

    <div class="stat-card">
        <h3>依科別統計掛號數</h3>
        <table>
            <thead>
                <tr>
                    <th>科別</th>
                    <th>掛號數</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${deptStats}">
                    <td th:text="${stat[0]}">科別</td>
                    <td th:text="${stat[1]}">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p><a th:href="@{/}">← 返回首頁</a></p>
</body>
</html>
